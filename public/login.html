<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | GTA Traffic</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script defer src="/js/auth.js"></script>
</head>
<body data-auth-mode="login">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand">
        <strong>GTA Traffic</strong>
        <a href="/">Home</a>
      </div>

      <h1>Log in</h1>
      <p>Open your GTA Traffic dashboard and continue building your workspace.</p>

      <form id="authForm">
        <label>
          Email
          <input id="emailInput" type="email" autocomplete="email" required>
        </label>

        <label>
          Password
          <input id="passwordInput" type="password" autocomplete="current-password" required>
        </label>

        <button type="submit">Log In</button>
        <div id="authStatus" class="status"></div>
      </form>

      <div class="auth-footer">
        Need an account? <a href="/register.html">Create one free</a>
      </div>
    </section>
  </main>
</body>
</html>
